<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="XNR planned supply: 72.9 billion launch tokens, 92.1 billion reserved for staking rewards, 165 billion maximum supply"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72777f"/><stop offset=".48" stop-color="#f6f7f9"/><stop offset="1" stop-color="#a8afb8"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f3f5f7"/><stop offset="1" stop-color="#8b929b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.small{font-size:15px;letter-spacing:3px;fill:#bfc4cb}.big{font-size:70px;fill:#f5f6f7;font-weight:500}.label{font-size:18px;fill:#d3d6da}.hair{stroke:#666c74;stroke-width:1;opacity:.6}.bar{transform-origin:90px 290px;animation:reveal 2.2s cubic-bezier(.22,.7,.1,1) both}.pulse{animation:bright 3s ease-in-out infinite alternate}@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes bright{from{opacity:.6}to{opacity:1}}@media(prefers-reduced-motion:reduce){.bar,.pulse{animation:none}}</style><text x="90" y="85" class="small">XNR / TOKEN SUPPLY ARCHITECTURE</text><path d="M90 108H1110" class="hair"/><text x="90" y="200" class="big">165B</text><text x="380" y="194" class="label">MAXIMUM SUPPLY</text><text x="90" y="257" class="small">44.18% / LAUNCH</text><text x="1110" y="257" text-anchor="end" class="small">55.82% / STAKING RESERVE</text><rect x="90" y="283" width="1020" height="36" fill="#25282d"/><g class="bar"><rect x="90" y="283" width="450.6" height="36" fill="url(#metal)"/></g><path d="M540.6 270V333" stroke="#f4f4f4" stroke-width="1.5"/><text x="90" y="402" class="big" style="font-size:52px">72.9B</text><text x="90" y="437" class="label">LAUNCH SUPPLY</text><text x="1110" y="402" text-anchor="end" class="big" style="font-size:52px">92.1B</text><text x="1110" y="437" text-anchor="end" class="label">STAKING / VALIDATOR REWARDS</text><path d="M90 476H1110" class="hair"/><text x="90" y="515" class="small">PROJECT TOKENOMICS PLAN / EMISSION SCHEDULE TO BE FINALIZED</text></svg>